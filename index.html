<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LKPD: Manajemen Server VPS AWS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="document-container">
      <!-- Header Dokumen -->
      <header class="doc-header">
        <h1>LKPD: Manajemen Server VPS AWS</h1>
        <div class="header-line"></div>
      </header>

      <!-- Kotak Identitas Siswa -->
      <section class="identity-box">
        <div class="identity-grid">
          <div class="form-group">
            <label for="nama">Nama</label>
            <span class="colon">:</span>
            <input type="text" id="nama" class="dashed-input" placeholder="Masukkan nama lengkap..." />
          </div>

          <div class="form-group">
            <label for="tanggal">Tanggal</label>
            <span class="colon">:</span>
            <input type="text" id="tanggal" class="dashed-input" placeholder="HH/BB/TTTT" />
          </div>

          <div class="form-group">
            <label for="kelas">Kelas</label>
            <span class="colon">:</span>
            <input type="text" id="kelas" class="dashed-input" placeholder="Masukkan kelas..." />
          </div>

          <div class="form-group">
            <label for="instruktur">Instruktur</label>
            <span class="colon">:</span>
            <input type="text" id="instruktur" class="dashed-input" placeholder="Masukkan nama instruktur..." />
          </div>
        </div>
      </section>

      <!-- Fase 1 -->
      <section class="phase-section">
        <h2 class="phase-title">Fase 1: Pengenalan Konsep VPS & Cloud</h2>
        <p class="instruction-text">Jelaskan secara singkat pemahaman Anda mengenai perbedaan layanan berikut dengan mengisi kotak yang tersedia.</p>

        <!-- Grid Kartu Layanan -->
        <div class="cards-grid">
          <!-- Kartu 1 -->
          <div class="service-card">
            <h3>Shared Hosting</h3>
            <textarea rows="4" placeholder="Tulis penjelasan mengenai Shared Hosting di sini..."></textarea>
          </div>

          <!-- Kartu 2 -->
          <div class="service-card">
            <h3>Dedicated Server</h3>
            <textarea rows="4" placeholder="Tulis penjelasan mengenai Dedicated Server di sini..."></textarea>
          </div>

          <!-- Kartu 3 -->
          <div class="service-card">
            <h3>Amazon Lightsail</h3>
            <textarea rows="4" placeholder="Tulis penjelasan mengenai Amazon Lightsail di sini..."></textarea>
          </div>

          <!-- Kartu 4 -->
          <div class="service-card">
            <h3>Amazon EC2</h3>
            <textarea rows="4" placeholder="Tulis penjelasan mengenai Amazon EC2 di sini..."></textarea>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
